name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK derle
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: APK'yi yeniden adlandir
        run: cp app/build/outputs/apk/debug/app-debug.apk AskeriDisiplin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AskeriDisiplin-apk
          path: AskeriDisiplin.apk

      - name: GitHub Release olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Askeri Disiplin (derleme ${{ github.run_number }})
          files: AskeriDisiplin.apk

      - name: APK'yi 'apk' dalina koy
        run: |
          mkdir /tmp/out && cp AskeriDisiplin.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add AskeriDisiplin.apk
          git commit -qm "APK derleme ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Hata kaydini 'build-log' dalina koy
        if: failure()
        run: |
          mkdir /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "log yok" > /tmp/log/build.log
          cd /tmp/log
          git init -q -b build-log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build.log
          git commit -qm "Derleme hatasi ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log
